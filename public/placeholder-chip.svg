<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a896" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goldTraces" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="16" fill="url(#bgGrad)" />

  <!-- PCB Circuit Grid Background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <path d="M 20 0 V 240 M 60 0 V 240 M 100 0 V 240 M 140 0 V 240 M 180 0 V 240 M 220 0 V 240" />
    <path d="M 0 20 H 240 M 0 60 H 240 M 0 100 H 240 M 0 140 H 240 M 0 180 H 240 M 0 220 H 240" />
  </g>

  <!-- Glowing PCB Traces -->
  <g stroke="url(#cyanGlow)" stroke-width="2" fill="none" filter="url(#neon)" opacity="0.85">
    <!-- Top Pins -->
    <path d="M 70 30 V 60 M 90 20 V 60 M 110 35 V 60 M 130 35 V 60 M 150 20 V 60 M 170 30 V 60" />
    <!-- Bottom Pins -->
    <path d="M 70 210 V 180 M 90 220 V 180 M 110 205 V 180 M 130 205 V 180 M 150 220 V 180 M 170 210 V 180" />
    <!-- Left Pins -->
    <path d="M 30 70 H 60 M 20 90 H 60 M 35 110 H 60 M 35 130 H 60 M 20 150 H 60 M 30 170 H 60" />
    <!-- Right Pins -->
    <path d="M 210 70 H 180 M 220 90 H 180 M 205 110 H 180 M 205 130 H 180 M 220 150 H 180 M 210 170 H 180" />
    <!-- Corner vias -->
    <circle cx="20" cy="90" r="3" fill="#38bdf8" />
    <circle cx="220" cy="90" r="3" fill="#38bdf8" />
    <circle cx="90" cy="20" r="3" fill="#38bdf8" />
    <circle cx="150" cy="220" r="3" fill="#38bdf8" />
  </g>

  <!-- Chip Body -->
  <rect x="58" y="58" width="124" height="124" rx="10" fill="url(#chipGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Chip Internal Bevel / Die Frame -->
  <rect x="66" y="66" width="108" height="108" rx="6" fill="#090e17" stroke="#1e293b" stroke-width="1.5" />

  <!-- Pin 1 Dot -->
  <circle cx="78" cy="78" r="4" fill="#38bdf8" filter="url(#neon)" />

  <!-- Gold Die Interconnect Core -->
  <rect x="94" y="94" width="52" height="52" rx="4" fill="#1e293b" stroke="url(#goldTraces)" stroke-width="1.5" />

  <!-- Microcontroller Label -->
  <text x="120" y="116" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.5">MCU / IC</text>
  <text x="120" y="132" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="1">ARDUINOHN</text>
</svg>
