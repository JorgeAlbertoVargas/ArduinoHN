<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#0f172a" rx="16"/>
  <!-- Pins top -->
  <line x1="50" y1="20" x2="50" y2="45" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="20" x2="75" y2="45" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="20" x2="100" y2="45" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="125" y1="20" x2="125" y2="45" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="20" x2="150" y2="45" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Pins bottom -->
  <line x1="50" y1="155" x2="50" y2="180" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="75" y1="155" x2="75" y2="180" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="155" x2="100" y2="180" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="125" y1="155" x2="125" y2="180" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="155" x2="150" y2="180" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>

  <!-- Pins left -->
  <line x1="20" y1="50" x2="45" y2="50" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="20" y1="75" x2="45" y2="75" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="20" y1="100" x2="45" y2="100" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="20" y1="125" x2="45" y2="125" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="20" y1="150" x2="45" y2="150" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>

  <!-- Pins right -->
  <line x1="155" y1="50" x2="180" y2="50" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="155" y1="75" x2="180" y2="75" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="155" y1="100" x2="180" y2="100" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="155" y1="125" x2="180" y2="125" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>
  <line x1="155" y1="150" x2="180" y2="150" stroke="#00a896" stroke-width="4" stroke-linecap="round"/>

  <!-- Chip Body -->
  <rect x="42" y="42" width="116" height="116" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="56" cy="56" r="4" fill="#64748b"/>
  
  <!-- Logo / Chip text -->
  <text x="100" y="98" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">SEMICON</text>
  <text x="100" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">ARDUINOHN</text>
</svg>
