<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="rBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="leadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="rGlow">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="240" height="240" rx="16" fill="url(#rBg)" />

  <!-- Circuit grid background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <path d="M 30 0 V 240 M 80 0 V 240 M 160 0 V 240 M 210 0 V 240" />
    <path d="M 0 30 H 240 M 0 80 H 240 M 0 160 H 240 M 0 210 H 240" />
  </g>

  <!-- Leads -->
  <path d="M 20 120 H 70 M 170 120 H 220" stroke="url(#leadGrad)" stroke-width="6" stroke-linecap="round" />
  
  <!-- SMD Pads Glow -->
  <circle cx="20" cy="120" r="5" fill="#38bdf8" filter="url(#rGlow)" opacity="0.8" />
  <circle cx="220" cy="120" r="5" fill="#38bdf8" filter="url(#rGlow)" opacity="0.8" />

  <!-- Resistor Body -->
  <path d="M 68 120 C 68 95, 78 95, 90 100 C 102 100, 138 100, 150 100 C 162 95, 172 95, 172 120 C 172 145, 162 145, 150 140 C 138 140, 102 140, 90 140 C 78 145, 68 145, 68 120 Z" fill="url(#bodyGrad)" stroke="#451a03" stroke-width="2" />

  <!-- Color Bands -->
  <!-- Band 1: Brown -->
  <rect x="85" y="99" width="7" height="42" fill="#78350f" rx="1" />
  <!-- Band 2: Black -->
  <rect x="100" y="100" width="7" height="40" fill="#0f172a" rx="1" />
  <!-- Band 3: Red (Multiplier) -->
  <rect x="116" y="100" width="7" height="40" fill="#dc2626" rx="1" />
  <!-- Band 4: Gold (Tolerance) -->
  <rect x="145" y="99" width="8" height="42" fill="#fbbf24" rx="1" filter="url(#rGlow)" />

  <!-- Waveform / Symbol Deco below -->
  <path d="M 80 175 L 90 175 L 95 168 L 105 182 L 115 168 L 125 182 L 135 168 L 145 182 L 150 175 L 160 175" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#rGlow)" opacity="0.9" />

  <!-- Label -->
  <text x="120" y="65" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2">RESISTOR / SMD</text>
  <text x="120" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1.5">ARDUINOHN</text>
</svg>
