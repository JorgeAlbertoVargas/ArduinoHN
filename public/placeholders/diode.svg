<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="dBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="dBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090e17" />
    </linearGradient>
    <linearGradient id="bandSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="dGlow">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="240" height="240" rx="16" fill="url(#dBg)" />

  <!-- Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <path d="M 30 0 V 240 M 120 0 V 240 M 210 0 V 240" />
    <path d="M 0 30 H 240 M 0 120 H 240 M 0 210 H 240" />
  </g>

  <!-- Leads -->
  <path d="M 20 120 H 60 M 180 120 H 220" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
  <circle cx="20" cy="120" r="4" fill="#00a896" filter="url(#dGlow)" />
  <circle cx="220" cy="120" r="4" fill="#38bdf8" filter="url(#dGlow)" />

  <!-- Diode Body (DO-41 / SOD-123) -->
  <rect x="60" y="95" width="120" height="50" rx="6" fill="url(#dBody)" stroke="#334155" stroke-width="2" />
  
  <!-- Cathode Silver Band -->
  <rect x="75" y="95" width="16" height="50" rx="2" fill="url(#bandSilver)" />

  <!-- Diode Schematic Symbol Glow -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" filter="url(#dGlow)" opacity="0.9">
    <!-- Triangle -->
    <polygon points="140,110 140,130 120,120" fill="#38bdf8" opacity="0.3" />
    <line x1="120" y1="110" x2="120" y2="130" stroke-width="2.5" />
  </g>

  <!-- Label -->
  <text x="120" y="55" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="2">DIODO / RECTIFICADOR</text>
  <text x="120" y="190" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1.5">ARDUINOHN</text>
</svg>
