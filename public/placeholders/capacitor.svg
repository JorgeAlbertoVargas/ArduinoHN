<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="stripeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a896" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="cGlow">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="240" height="240" rx="16" fill="url(#cBg)" />

  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <path d="M 40 0 V 240 M 120 0 V 240 M 200 0 V 240" />
    <path d="M 0 40 H 240 M 0 120 H 240 M 0 200 H 240" />
  </g>

  <!-- Capacitor Can (Electrolytic / SMD) -->
  <rect x="80" y="55" width="80" height="95" rx="8" fill="url(#canGrad)" stroke="#475569" stroke-width="2" />
  
  <!-- Negative Polarity Stripe -->
  <rect x="80" y="55" width="22" height="95" rx="4" fill="url(#stripeGrad)" filter="url(#cGlow)" opacity="0.9" />
  <text x="91" y="90" fill="#020617" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">-</text>
  <text x="91" y="120" fill="#020617" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle">-</text>

  <!-- Top Vent Stamp -->
  <circle cx="130" cy="70" r="12" fill="none" stroke="#64748b" stroke-width="1.5" />
  <path d="M 122 70 H 138 M 130 62 V 78" stroke="#64748b" stroke-width="1.5" />

  <!-- Leads -->
  <path d="M 105 150 V 200 M 135 150 V 210" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="105" cy="200" r="4" fill="#38bdf8" filter="url(#cGlow)" />
  <circle cx="135" cy="210" r="4" fill="#00a896" filter="url(#cGlow)" />

  <!-- Label -->
  <text x="120" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.5">CAPACITOR / CONDENSADOR</text>
  <text x="135" y="115" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">μF / SMD</text>
  <text x="120" y="230" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="1">ARDUINOHN</text>
</svg>
